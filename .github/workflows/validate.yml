name: Validate

# Runs in B-C-Software/doconda-skills: the plugin manifests and every link in the Markdown files.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate --strict .

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude 'api\.eu\.doconda\.com'
            --exclude 'npmjs\.com'
            --exclude 'github\.com/B-C-Software/doconda-skills/actions'
            './**/*.md'
          fail: true
